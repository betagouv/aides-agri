name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency: 
  group: ${{ github.head_ref || github.ref }}

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validation (test + code style)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: root
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          save-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install Python dependencies
        run: uv sync --all-extras --dev
      - name: Collect staticfiles
        run: uv run --no-sync manage.py collectstatic
        env:
          DJANGO_SETTINGS_MODULE: conf.settings.testing
          SECRET_KEY: notsecret
      - name: Run Ruff
        run: uv run --no-sync ruff check --output-format=github .
      - name: Check migrations
        run: uv run --no-sync manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: conf.settings.testing
          SECRET_KEY: notsecret
      - name: Run tests
        run: uv run --no-sync pytest --cov --cov-report=xml
        env:
          DJANGO_SETTINGS_MODULE: conf.settings.testing
          SECRET_KEY: notsecret
      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: didSomeHTMLChange
        with:
          filters: |
            src:
              - '**/*.html'
      - name: Load fixtures for E2E testing
        if: steps.didSomeHTMLChange.outputs.src == 'true'
        run: |
          uv run --no-sync manage.py migrate
          uv run --no-sync manage.py loaddata conf/fixtures/dsfr_config.json aides.json
        env:
          DJANGO_SETTINGS_MODULE: conf.settings.testing
          SECRET_KEY: notsecret
      - name: Run website for E2E tests
        if: steps.didSomeHTMLChange.outputs.src == 'true'
        run: |
          uv run --no-sync manage.py runserver --noreload --insecure --settings conf.settings.testing &
        env:
          DJANGO_SETTINGS_MODULE: conf.settings.testing
          SECRET_KEY: notsecret
      - name: Setup Javascript runtime
        if: steps.didSomeHTMLChange.outputs.src == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install JS dependencies for E2E testing
        if: steps.didSomeHTMLChange.outputs.src == 'true'
        run: npm ci --ignore-scripts
      - name: Run Lighthouse
        if: steps.didSomeHTMLChange.outputs.src == 'true'
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Run Cypress E2E tests
        if: steps.didSomeHTMLChange.outputs.src == 'true'
        uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626  # v7.4.1
