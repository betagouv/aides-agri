name: Vendor JS dependencies
on:
  pull_request:
    paths:
      - 'package-lock.json'

concurrency:
  group: ${{ github.head_ref || github.ref }}

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Vendoring of JS dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Clean-install JS dependencies
        run: npm ci --ignore-scripts
      - name: Vendor JS dependencies that distribute a bundle
        run: |
          while read jsfile; do cp "node_modules/$jsfile" "static/vendor/" && echo "Vendored $jsfile"; done <vendor.txt
      - name: Compile-then-vendor JS dependencies that don't
        run: |
          echo 'export * as Sentry from "@sentry/browser"' | ./node_modules/.bin/esbuild --bundle --minify --format=esm --outfile=static/vendor/sentry.js
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d  # 7.2.0
        with:
          file_pattern: 'static/vendor/*.*'
          commit_message: 'chore(deps): vendor dependencies'
